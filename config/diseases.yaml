    seche: [0, 3]          # phase 1, début (« phase sèche ») : J1 à J4 de la maladie, contagieux dès la fièvre
    humide: [4, 7]         # phase 2, état (« phase humide ») : J4 à J7, très contagieux (liquides biologiques)
    critique: [7, 16]      # phase 3, tournant : J7 à J16, guérison ou aggravation (défaillances, saignements)
  deces_intervalle: [7, 16]   # décès pendant la phase critique (J7 à J16)
  suivi_contacts: 21
