# Tests automatiques à chaque envoi sur GitHub : une erreur est signalée avant la mise à jour du serveur.
# Résultat : onglet Actions (coche verte ou croix rouge) ; GitHub prévient par e-mail en cas d'échec.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
