{% extends "base.html" %}
{% block content %}
<div class="auth" style="margin-top:3vh">
  <h1>Mon compte</h1>
  <form class="card stack" method="post">
    <p class="muted">{{ me.nom }} — identifiant <b>{{ me.username }}</b> ({{ me.role }})</p>
    {% if msg %}<div class="alert ok">{{ msg }}</div>{% endif %}
    {% if err %}<div class="alert err">{{ err }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div><label class="f">Mot de passe actuel</label><input name="old" type="password" autocomplete="current-password" required></div>
    <div><label class="f">Nouveau mot de passe</label><input name="new" type="password" minlength="8" autocomplete="new-password" required></div>
    <div><label class="f">Confirmer</label><input name="new2" type="password" minlength="8" autocomplete="new-password" required></div>
    <button class="btn primary">Changer le mot de passe</button>
  </form>
</div>
{% endblock %}
